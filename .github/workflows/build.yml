name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: android/tailscale-bridge/go.mod
          cache-dependency-path: android/tailscale-bridge/go.sum

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Server-Tests
        run: ./gradlew :backend:server:test

      - name: Web-App bauen
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Tailscale-Brücke bauen (tsbridge.aar)
        run: ./android/tailscale-bridge/build.sh

      - name: APKs bauen
        run: ./gradlew :android:app-host:assembleDebug :android:app-student:assembleDebug

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: classview-apks
          path: |
            android/app-host/build/outputs/apk/debug/app-host-debug.apk
            android/app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Testbericht bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/server/build/reports/tests/
